apiVersion: v1
kind: PersistentVolume
metadata:
  name: training-nfs-lab01
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  claimRef:
    namespace: lab01
    name: demo-static-data
  nfs:
    server: 192.0.2.10
    path: /ifs/training/lab01
