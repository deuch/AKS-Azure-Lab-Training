apiVersion: batch/v1
kind: Job
metadata:
  name: parallel-batch
spec:
  completions: 6
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app: jobs-lab
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: docker.io/nginxinc/nginx-unprivileged:1.31.7-alpine
          command:
            - sh
            - -c
            - |
              echo "Processing work item ${JOB_COMPLETION_INDEX} on Pod $(hostname)"
              sleep 15
              echo "Item ${JOB_COMPLETION_INDEX} done"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
