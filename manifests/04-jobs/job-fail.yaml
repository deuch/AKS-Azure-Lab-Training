apiVersion: batch/v1
kind: Job
metadata:
  name: fail-demo
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app: jobs-lab
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: task
          image: docker.io/nginxinc/nginx-unprivileged:1.31.7-alpine
          command:
            - sh
            - -c
            - |
              echo "Attempt on Pod $(hostname): simulating a failure"
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
