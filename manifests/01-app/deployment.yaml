apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels:
    app: demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: docker.io/nginxinc/nginx-unprivileged:1.31.7-alpine
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_MODE
              valueFrom:
                configMapKeyRef:
                  name: demo-config
                  key: APP_MODE
            - name: TRAINING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: demo-secret
                  key: TRAINING_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: data
              mountPath: /usr/share/nginx/html/data
            - name: token
              mountPath: /run/training
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: demo-config
        - name: data
          emptyDir: {}
        - name: token
          secret:
            secretName: demo-secret
            defaultMode: 0440
