deployment:
  replicas: 2
providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: true
  kubernetesGateway:
    enabled: true
    experimentalChannel: false
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik
gateway:
  enabled: false
gatewayClass:
  enabled: false
service:
  type: LoadBalancer
ports:
  web:
    port: 8000
    exposedPort: 80
  websecure:
    port: 8443
    exposedPort: 443
api:
  dashboard: false
  insecure: false
ingressRoute:
  dashboard:
    enabled: false
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
