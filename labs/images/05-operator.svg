<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='720' viewBox='0 0 1280 720' role='img' aria-labelledby='title'><title id='title'>Operator example: declare a certificate, get a Secret</title><defs><marker id='arrow' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#495057'/></marker></defs><rect width='1280' height='720' fill='white'/><g font-family='Segoe UI, Arial, sans-serif' fill='black'>
<text x='40' y='58' font-size='32' font-weight='600'>Operator example: declare a certificate, get a Secret</text>
<text x='40' y='102' font-size='20' font-weight='400'>CRDs register types; a running controller performs and maintains the domain work.</text>
<rect x='40' y='150' width='350' height='185' fill='#CFE4FA' stroke='#0078D4' stroke-width='2'/>
<text x='58' y='189' font-size='24' font-weight='600'>CRDs + your resources</text>
<text x='58' y='227' font-size='20' font-weight='400'>CRDs: register Issuer/Certificate</text>
<text x='58' y='257' font-size='20' font-weight='400'>Issuer: how to sign</text>
<text x='58' y='287' font-size='20' font-weight='400'>Certificate: desired DNS + key</text>
<rect x='485' y='150' width='350' height='185' fill='#E8DAEF' stroke='#5C2D91' stroke-width='2'/>
<text x='503' y='189' font-size='24' font-weight='600'>cert-manager</text>
<text x='503' y='227' font-size='20' font-weight='400'>Controller reconciles resources</text>
<text x='503' y='257' font-size='20' font-weight='400'>CertificateRequest: issuance</text>
<text x='503' y='287' font-size='20' font-weight='400'>Renews/repairs the output</text>
<rect x='930' y='150' width='310' height='185' fill='#FFF4CE' stroke='#F7630C' stroke-width='2'/>
<text x='948' y='189' font-size='24' font-weight='600'>TLS Secret</text>
<text x='948' y='227' font-size='20' font-weight='400'>Certificate + private key</text>
<text x='948' y='257' font-size='20' font-weight='400'>tls.crt / tls.key</text>
<text x='948' y='287' font-size='20' font-weight='400'>Never print the key</text>
<line x1='390' y1='245' x2='485' y2='245' stroke='#495057' stroke-width='2' marker-end='url(#arrow)'/>
<line x1='835' y1='245' x2='930' y2='245' stroke='#495057' stroke-width='2' marker-end='url(#arrow)'/>
<rect x='40' y='450' width='690' height='155' fill='#F3F2F1' stroke='#495057' stroke-width='2'/>
<text x='58' y='489' font-size='24' font-weight='600'>What Helm did versus what the operator does</text>
<text x='58' y='527' font-size='20' font-weight='400'>Helm installed the shared controller once.</text>
<text x='58' y='557' font-size='20' font-weight='400'>cert-manager keeps reconciling after Helm exits.</text>
<rect x='850' y='450' width='390' height='155' fill='#DFF6DD' stroke='#107C10' stroke-width='2'/>
<text x='868' y='489' font-size='24' font-weight='600'>Traefik + Ingress</text>
<text x='868' y='527' font-size='20' font-weight='400'>Reference the local TLS Secret</text>
<text x='868' y='557' font-size='20' font-weight='400'>Terminate incoming HTTPS</text>
<line x1='1085' y1='335' x2='1045' y2='450' stroke='#495057' stroke-width='2' marker-end='url(#arrow)'/>
<text x='40' y='685' font-size='20' font-weight='400'>SelfSigned is a demo: successful issuance is not trusted TLS. The controller is not in the HTTP traffic path.</text>
</g></svg>
