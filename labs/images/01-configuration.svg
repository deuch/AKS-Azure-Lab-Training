<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='720' viewBox='0 0 1280 720' role='img' aria-labelledby='title'><title id='title'>Same image, separate configuration</title><defs><marker id='arrow' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#495057'/></marker></defs><rect width='1280' height='720' fill='white'/><g font-family='Segoe UI, Arial, sans-serif' fill='black'>
<text x='40' y='58' font-size='32' font-weight='600'>Same image, separate configuration</text>
<text x='40' y='102' font-size='20' font-weight='400'>ConfigMaps and Secrets are namespaced API objects referenced by the Pod template.</text>
<rect x='40' y='155' width='400' height='155' fill='#CFE4FA' stroke='#0078D4' stroke-width='2'/>
<text x='58' y='194' font-size='24' font-weight='600'>ConfigMap: demo-config</text>
<text x='58' y='232' font-size='20' font-weight='400'>APP_MODE: training</text>
<text x='58' y='262' font-size='20' font-weight='400'>index.html: web content</text>
<rect x='40' y='365' width='400' height='155' fill='#FFF4CE' stroke='#F7630C' stroke-width='2'/>
<text x='58' y='404' font-size='24' font-weight='600'>Secret: demo-secret</text>
<text x='58' y='442' font-size='20' font-weight='400'>Dummy TRAINING_TOKEN</text>
<text x='58' y='472' font-size='20' font-weight='400'>Not a browser login feature</text>
<rect x='680' y='155' width='560' height='215' fill='#DFF6DD' stroke='#107C10' stroke-width='2'/>
<text x='698' y='194' font-size='24' font-weight='600'>Each application Pod</text>
<text x='698' y='232' font-size='20' font-weight='400'>Environment values read at startup</text>
<text x='698' y='262' font-size='20' font-weight='400'>index.html: ConfigMap subPath mount</text>
<text x='698' y='292' font-size='20' font-weight='400'>/run/training: read-only Secret files</text>
<text x='698' y='322' font-size='20' font-weight='400'>Web data directory: initially emptyDir</text>
<line x1='440' y1='230' x2='680' y2='230' stroke='#495057' stroke-width='2' marker-end='url(#arrow)'/>
<line x1='440' y1='440' x2='680' y2='330' stroke='#495057' stroke-width='2' marker-end='url(#arrow)'/>
<rect x='680' y='435' width='560' height='185' fill='#E8DAEF' stroke='#5C2D91' stroke-width='2'/>
<text x='698' y='474' font-size='24' font-weight='600'>Update behavior in this lab</text>
<text x='698' y='512' font-size='20' font-weight='400'>Environment: restart needed</text>
<text x='698' y='542' font-size='20' font-weight='400'>subPath file: restart needed</text>
<text x='698' y='572' font-size='20' font-weight='400'>Normal projected files: eventual refresh</text>
<text x='40' y='685' font-size='20' font-weight='400'>Secret files stay outside the web root. Base64 encoding is not encryption or safe Git storage.</text>
