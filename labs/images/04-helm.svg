<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='720' viewBox='0 0 1280 720' role='img' aria-labelledby='title'><title id='title'>Helm: package -&gt; render -&gt; install a release</title><defs><marker id='arrow' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#495057'/></marker></defs><rect width='1280' height='720' fill='white'/><g font-family='Segoe UI, Arial, sans-serif' fill='black'>
<text x='40' y='58' font-size='32' font-weight='600'>Helm: package -&gt; render -&gt; install a release</text>
<text x='40' y='102' font-size='20' font-weight='400'>Helm generates ordinary Kubernetes objects; it does not replace their controllers.</text>
<rect x='40' y='155' width='325' height='185' fill='#CFE4FA' stroke='#0078D4' stroke-width='2'/>
<text x='58' y='194' font-size='24' font-weight='600'>Chart + values</text>
<text x='58' y='232' font-size='20' font-weight='400'>Templates and defaults</text>
<text x='58' y='262' font-size='20' font-weight='400'>Message, replicas, hostname</text>
<text x='58' y='292' font-size='20' font-weight='400'>Local inputs, not API types</text>
<rect x='475' y='155' width='325' height='185' fill='#E8DAEF' stroke='#5C2D91' stroke-width='2'/>
<text x='493' y='194' font-size='24' font-weight='600'>Rendered manifests</text>
<text x='493' y='232' font-size='20' font-weight='400'>Deployment + ConfigMap</text>
<text x='493' y='262' font-size='20' font-weight='400'>Service + Ingress</text>
<text x='493' y='292' font-size='20' font-weight='400'>Inspect YAML before install</text>
<rect x='910' y='155' width='330' height='185' fill='#DFF6DD' stroke='#107C10' stroke-width='2'/>
<text x='928' y='194' font-size='24' font-weight='600'>Release: helm-web</text>
<text x='928' y='232' font-size='20' font-weight='400'>One install in a namespace</text>
<text x='928' y='262' font-size='20' font-weight='400'>Creates/updates resources</text>
<text x='928' y='292' font-size='20' font-weight='400'>Helm records revisions</text>
<line x1='365' y1='245' x2='475' y2='245' stroke='#495057' stroke-width='2' marker-end='url(#arrow)'/>
<line x1='800' y1='245' x2='910' y2='245' stroke='#495057' stroke-width='2' marker-end='url(#arrow)'/>
<rect x='40' y='450' width='1200' height='155' fill='#F3F2F1' stroke='#495057' stroke-width='2'/>
<text x='58' y='489' font-size='24' font-weight='600'>Revision history in this exercise</text>
<text x='58' y='527' font-size='20' font-weight='400'>Revision 1: version 1, two replicas   -&gt;   Revision 2: version 2, three replicas</text>
<text x='58' y='557' font-size='20' font-weight='400'>Rollback to 1 records revision 3: version 1, two replicas; it does not rewind application data</text>
<text x='40' y='685' font-size='20' font-weight='400'>A ConfigMap checksum changes the Pod template on upgrade. Release history can contain sensitive values.</text>
</g></svg>
