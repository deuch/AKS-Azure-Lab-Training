<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='720' viewBox='0 0 1280 720' role='img' aria-labelledby='title'><title id='title'>Traffic flow is not the same as configuration</title><defs><marker id='arrow' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#495057'/></marker></defs><rect width='1280' height='720' fill='white'/><g font-family='Segoe UI, Arial, sans-serif' fill='black'>
<text x='40' y='58' font-size='32' font-weight='600'>Traffic flow is not the same as configuration</text>
<text x='40' y='102' font-size='20' font-weight='400'>Solid arrows: logical HTTP path. Dashed arrows: API configuration or endpoint discovery.</text>
<rect x='40' y='155' width='510' height='155' fill='#CFE4FA' stroke='#0078D4' stroke-width='2'/>
<text x='58' y='194' font-size='24' font-weight='600'>Ingress option</text>
<text x='58' y='232' font-size='20' font-weight='400'>IngressClass -&gt; Traefik implementation</text>
<text x='58' y='262' font-size='20' font-weight='400'>Ingress: hostname/path -&gt; Service</text>
<rect x='650' y='155' width='590' height='155' fill='#E8DAEF' stroke='#5C2D91' stroke-width='2'/>
<text x='668' y='194' font-size='24' font-weight='600'>Gateway API option</text>
<text x='668' y='232' font-size='20' font-weight='400'>GatewayClass -&gt; Gateway listener</text>
<text x='668' y='262' font-size='20' font-weight='400'>HTTPRoute: attachment + Service backend</text>
<rect x='40' y='435' width='190' height='155' fill='#F3F2F1' stroke='#495057' stroke-width='2'/>
<text x='58' y='474' font-size='24' font-weight='600'>Client</text>
<text x='58' y='512' font-size='20' font-weight='400'>Host header</text>
<text x='58' y='542' font-size='20' font-weight='400'>VIP :80/443</text>
<rect x='305' y='435' width='265' height='155' fill='#DFF6DD' stroke='#107C10' stroke-width='2'/>
<text x='323' y='474' font-size='24' font-weight='600'>Traefik</text>
<text x='323' y='512' font-size='20' font-weight='400'>Shared LB Service</text>
<text x='323' y='542' font-size='20' font-weight='400'>HTTP reverse proxy</text>
<rect x='645' y='435' width='250' height='155' fill='#CFE4FA' stroke='#0078D4' stroke-width='2'/>
<text x='663' y='474' font-size='24' font-weight='600'>App Service</text>
<text x='663' y='512' font-size='20' font-weight='400'>demo :80</text>
<text x='663' y='542' font-size='20' font-weight='400'>Selector: app=demo</text>
<rect x='970' y='435' width='270' height='155' fill='#DFF6DD' stroke='#107C10' stroke-width='2'/>
<text x='988' y='474' font-size='24' font-weight='600'>Ready Pods</text>
<text x='988' y='512' font-size='20' font-weight='400'>Container :8080</text>
<text x='988' y='542' font-size='20' font-weight='400'>Replaceable IPs</text>
<line x1='230' y1='510' x2='305' y2='510' stroke='#495057' stroke-width='2' marker-end='url(#arrow)'/>
<line x1='570' y1='510' x2='645' y2='510' stroke='#495057' stroke-width='2' marker-end='url(#arrow)'/>
<line x1='895' y1='510' x2='970' y2='510' stroke='#495057' stroke-width='2' marker-end='url(#arrow)'/>
<line x1='350' y1='310' x2='420' y2='435' stroke='#495057' stroke-width='2' stroke-dasharray='8 6' marker-end='url(#arrow)'/>
<line x1='865' y1='310' x2='505' y2='435' stroke='#495057' stroke-width='2' stroke-dasharray='8 6' marker-end='url(#arrow)'/>
<text x='760' y='395' font-size='20' font-weight='400'>EndpointSlices = IPs + readiness</text>
<text x='40' y='685' font-size='20' font-weight='400'>MetalLB/existing L4 exposes the VIP; Traefik implements L7 rules. App Service is a logical backend.</text>
</g></svg>
